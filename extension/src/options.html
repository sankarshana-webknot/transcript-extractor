<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Transcript Extractor Options</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 16px; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input { width: 100%; padding: 8px; font-size: 14px; }
      button { margin-top: 12px; padding: 8px 12px; font-size: 14px; }
      .row { max-width: 560px; }
      .hint { color: #666; font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="row">
      <h2>Transcript Extractor - Dual Endpoint</h2>
      <label for="wsAppendUrl">Append Endpoint URL (Hardcoded)</label>
      <input id="wsAppendUrl" type="text" readonly />
      <div class="hint">WebSocket URL for sending transcript words to append endpoint.</div>
      
      <label for="wsCheckUrl">Check Endpoint URL (Hardcoded)</label>
      <input id="wsCheckUrl" type="text" readonly />
      <div class="hint">WebSocket URL for sending transcript words to check endpoint.</div>
      
      <button id="save" disabled>URLs are hardcoded</button>
    </div>
    <script src="options.js"></script>
  </body>
  </html>
