<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Transcript Extractor Options</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 16px; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input { width: 100%; padding: 8px; font-size: 14px; }
      button { margin-top: 12px; padding: 8px 12px; font-size: 14px; }
      .row { max-width: 560px; }
      .hint { color: #666; font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="row">
      <h2>Transcript Extractor</h2>
      <label for="wsUrl">WebSocket server URL</label>
      <input id="wsUrl" type="text" placeholder="ws://localhost:8080" />
      <div class="hint">Updates take effect immediately.</div>
      <button id="save">Save</button>
    </div>
    <script src="options.js"></script>
  </body>
  </html>
